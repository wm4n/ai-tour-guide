[project]
name = "buddy-host"
version = "0.1.0"
description = "AI Buddy Tour v2 的家中主機服務（Claude Code、語音管線、景點準備）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx2>=2.14.0",
    "opencc-python-reimplemented>=0.1.7",
    "numpy>=2.5.4",
    "truststore>=0.10.5",
]

[dependency-groups]
# 語音引擎很重（torch 等），只在要實際合成時安裝：uv sync --group speech
speech = [
    "kittenml==0.9.4",
    "openai-whisper>=20240930",
    "scipy>=1.11",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buddy_host"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
